<!doctype html><meta charset="utf-8"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}</style><iframe id="app" src="/participants"></iframe><script>const frame=document.querySelector('#app');frame.addEventListener('load',()=>setTimeout(()=>{const doc=frame.contentDocument;const button=[...doc.querySelectorAll('button')].find(x=>x.textContent.includes('Samuel K. Doe'));button?.click();setTimeout(()=>{const root=document.createElement('pre');root.style='position:fixed;inset:8px auto auto 8px;padding:8px;background:#fff;z-index:99999;font:12px monospace';root.textContent=JSON.stringify({url:frame.contentWindow.location.pathname,title:doc.querySelector('#modal-title')?.textContent,profile:!!doc.querySelector('.participant-profile-page'),overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth,bodyWidth:doc.documentElement.scrollWidth,viewport:doc.documentElement.clientWidth,sidebarWidth:doc.querySelector('.sidebar')?.getBoundingClientRect().width},null,2);document.body.append(root)},450)},900))</script>
